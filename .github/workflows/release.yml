name: Release

# Pushing a tag v<project version> (e.g. v0.2.0) publishes it: CI runs on the tagged commit, the multi-arch
# image goes to ghcr.io/k-sandhu/emulators as :<tag> and :latest, and the sdist, wheel and pinned
# docker-compose.yml are attached to a GitHub Release with notes built from the commits since the last tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancel a half-published release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/k-sandhu/emulators

jobs:
  version:
    name: Tag matches the project version
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: python3 scripts/release.py check "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  ci:
    needs: [version]
    uses: ./.github/workflows/ci.yml

  dist:
    name: Python sdist and wheel
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"
      - run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: uv run --isolated --no-project --with dist/*.whl emulators list
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  image:
    name: Image (linux/amd64, linux/arm64)
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        env:
          # Multi-arch images show their description on GHCR only from index annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # Prereleases (v0.2.0rc1) get only their own tag; :latest stays on the newest final release.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}

      # Test before pushing so a broken build never reaches :latest. The push below reuses these layers.
      - name: Build linux/amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: emulators:smoke
          cache-from: type=gha
      - name: Smoke-test the published compose file with the image (vendor hostnames over HTTPS)
        env:
          EMULATORS_IMAGE: emulators:smoke
        run: |
          docker compose -f docker-compose.yml up -d --wait
          docker run --rm --network emulators-vendors -v emulators-certs:/certs:ro \
            -v "$PWD/scripts/docker_hostname_check.py:/check.py:ro" --entrypoint python emulators:smoke /check.py
      - name: Compose logs
        if: failure()
        env:
          EMULATORS_IMAGE: emulators:smoke
        run: docker compose -f docker-compose.yml logs --tail 200
      - name: Build linux/arm64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: emulators:smoke-arm64
          cache-from: type=gha
      - name: Smoke-test linux/arm64 (QEMU)
        run: docker run --rm --platform linux/arm64 emulators:smoke-arm64 list

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [version, dist, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release notes from the commits since the previous tag
        run: python3 scripts/release.py notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create the release (a re-run refreshes the assets)
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* docker-compose.yml --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* docker-compose.yml --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$PRERELEASE"
          fi
      - name: Image is pullable without credentials
        run: |
          if ! docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"; then
            echo "::warning::$IMAGE:$GITHUB_REF_NAME is not anonymously pullable; set the package to Public at https://github.com/users/k-sandhu/packages/container/emulators/settings"
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the whole suite on the tagged commit before publishing anything.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: docker-compose files match the providers and the project version
        run: uv run python scripts/gen_compose.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (media validation tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run pytest -q -ra

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Start emulators with vendor hostnames (compose)
        run: docker compose up -d --build --wait
      - name: Real-hostname HTTPS check from another container
        run: |
          docker run --rm --network emulators-vendors -v emulators-certs:/certs:ro             -v "$PWD/scripts/docker_hostname_check.py:/check.py:ro" --entrypoint python emulators:local /check.py
      - name: Gateway index
        run: curl -fsS http://127.0.0.1:44080/_emulator | head -c 2000
      - name: Logs
        if: always()
        run: docker compose logs --tail 200

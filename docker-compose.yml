# Generated by scripts/gen_compose.py — do not edit the alias list by hand.
#
# Other compose projects reach the emulators under the vendors' real hostnames by joining the
# external network `emulators-vendors` and trusting the CA in the `emulators-certs` volume.
# See docs/howto/docker-compose.md.
name: emulators

services:
  emulators:
    build: .
    image: emulators:local
    environment:
      EMULATORS_PORT: "80"
      EMULATORS_HTTPS_PORT: "443"
      EMULATORS_PROVIDERS: ${EMULATORS_PROVIDERS:-}
      EMULATORS_ANCHOR: ${EMULATORS_ANCHOR:-}
      EMULATORS_SEED: ${EMULATORS_SEED:-emulators}
      EMULATORS_WEBHOOK_MODE: ${EMULATORS_WEBHOOK_MODE:-async}
    # Bind 80/443 as the non-root user.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "${EMULATORS_HTTP_HOST_PORT:-44080}:80"
      - "${EMULATORS_HTTPS_HOST_PORT:-44443}:443"
      - "44101:44101"
      - "44102:44102"
      - "44110:44110"
    volumes:
      - certs:/certs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/_emulator/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      vendors:
        aliases:
          - accounts.google.com
          - admin.googleapis.com
          - api.stripe.com
          - billing.stripe.com
          - calendar-json.googleapis.com
          - checkout.stripe.com
          - connect.stripe.com
          - content.googleapis.com
          - docs.google.com
          - docs.googleapis.com
          - drive.google.com
          - drive.googleapis.com
          - files.stripe.com
          - gmail.googleapis.com
          - graph.microsoft.com
          - graph.windows.net
          - halcyonadvisory-my.sharepoint.com
          - halcyonadvisory.sharepoint.com
          - invoice.stripe.com
          - login.microsoftonline.com
          - login.windows.net
          - meet.google.com
          - meet.googleapis.com
          - oauth2.googleapis.com
          - openidconnect.googleapis.com
          - pay.stripe.com
          - pubsub.googleapis.com
          - sheets.googleapis.com
          - uploads.stripe.com
          - www.googleapis.com

volumes:
  certs:
    name: emulators-certs

networks:
  vendors:
    name: emulators-vendors
